<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Akarinaru Studio — Illustration, Animation &amp; Rigging</title>
<meta name="description" content="Akarinaru Studio — commissions for digital illustration, animation, Live2D rigging and anime-style 3D models. Living characters, drawn and brought to motion.">
<meta property="og:title" content="Akarinaru Studio — Studio of Living Characters">
<meta property="og:description" content="Illustration · Animation · Live2D & 3D Rigging. Commissions open on Etsy.">
<meta property="og:type" content="website">
<meta property="og:image" content="assets/og-image.jpg">
<meta name="theme-color" content="#1A1F5C">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;0,600;0,700;1,600;1,700&family=Playfair+Display:ital,wght@0,900;1,900&family=Cinzel+Decorative:wght@700;900&family=Jost:wght@400;500;600&family=Pinyon+Script&display=swap">
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<div id="root" class="sky">

  <!-- Layered fantasy background (filled by fx.js) -->
  <div id="bg" aria-hidden="true">
    <div class="layer layer--far" id="layerFar"></div>
    <div class="layer layer--cross" id="layerCross"></div>
    <div class="layer layer--gemsMid" id="layerGemsMid"></div>
    <div class="layer layer--near" id="layerNear"></div>
    <div class="layer layer--gemsNear" id="layerGemsNear"></div>
  </div>

  <!-- Fixed 1600×900 stage -->
  <div id="stage">
    <header class="top">
      <a class="logo" href="#home" data-go="home" aria-label="Akarinaru Studio — Home">
        <span class="logo__name">AKARINARU</span><span class="logo__studio">Studio</span>
      </a>
      <div class="top__right">
        <span class="slots"><span class="slots__label">Slots</span> <b>3</b> / 5</span>
        <button class="sound" id="soundBtn" type="button" aria-pressed="false" aria-label="Turn background music on/off">
          <span class="eq" aria-hidden="true"><i></i><i></i><i></i><i></i></span>
          <span class="sound__txt">Sound off</span>
        </button>
      </div>
    </header>

    <div class="body">
      <nav class="menu" aria-label="Main">
        <ul id="menuList"></ul>
      </nav>
      <main id="main">
        <section class="screen screen--home" id="screen-home" aria-label="Home" hidden></section>
        <section class="screen screen--gallery" id="screen-gallery" aria-label="Gallery" hidden></section>
        <section class="screen screen--services" id="screen-services" aria-label="Services" hidden></section>
        <section class="screen screen--atelier" id="screen-atelier" aria-label="Atelier" hidden></section>
        <section class="screen screen--commission" id="screen-commission" aria-label="Commission" hidden></section>
      </main>
    </div>

    <div class="pager" id="pager" role="group" aria-label="Pages"></div>
  </div>

  <!-- Cursor light, sparks, click bursts -->
  <div id="fx" aria-hidden="true">
    <div class="cursor-glow" id="cursorGlow"></div>
    <div class="cursor-dot" id="cursorDot"></div>
  </div>

  <!-- Fate card dialog -->
  <div id="fate" class="fate" role="dialog" aria-modal="true" aria-labelledby="fateName" hidden></div>

  <!-- Page transition veil -->
  <div id="veil" hidden aria-hidden="true">
    <div class="bar bar1"></div><div class="bar bar2"></div><div class="bar bar3"></div>
    <div class="veil__center">
      <svg class="veil__burst" viewBox="0 0 200 200" aria-hidden="true">
        <g fill="none" stroke="#FFE3A3" stroke-width="2">
          <circle cx="100" cy="100" r="34"/><circle cx="100" cy="100" r="46" stroke-opacity=".5"/>
        </g>
        <g fill="#FFE3A3">
          <path d="M100 6 L104 70 L100 80 L96 70Z"/><path d="M100 194 L104 130 L100 120 L96 130Z"/>
          <path d="M6 100 L70 96 L80 100 L70 104Z"/><path d="M194 100 L130 96 L120 100 L130 104Z"/>
        </g>
        <g fill="#FF8FC4">
          <path d="M33 33 L78 74 L80 80 L74 78Z"/><path d="M167 33 L126 78 L120 80 L122 74Z"/>
          <path d="M33 167 L74 122 L80 120 L78 126Z"/><path d="M167 167 L122 126 L120 120 L126 122Z"/>
        </g>
      </svg>
      <span class="veil__label" id="veilLabel"></span>
      <span class="veil__label veil__sub">Akarinaru Studio</span>
    </div>
  </div>

  <!-- Start screen -->
  <div id="start">
    <div class="start__decor" id="startDecor" aria-hidden="true"></div>
    <div class="start__center">
      <span class="start__script" aria-hidden="true">Akarinaru</span>
      <p class="start__title" id="startTitle"></p>
      <div class="start__sub" id="startSub"></div>
      <p class="start__tags">Illustration · Animation · Rigging</p>
      <div class="start__load" aria-hidden="true"><span></span></div>
      <button class="btn-orn btn-orn--lg start__enter" id="enterBtn" type="button">
        <span class="btn-orn__shine" aria-hidden="true"></span>Enter the Atelier
      </button>
    </div>
  </div>
</div>

<script src="js/data.js"></script>
<script src="js/music.js"></script>
<script src="js/stage.js"></script>
<script src="js/fx.js"></script>
<script src="js/main.js"></script>
</body>
</html>
